[theme]
primaryColor = "#e74c3c"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8f9fa"
textColor = "#2c3e50"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "minimal"

[server]
maxUploadSize = 200
enableXsrfProtection = true
headless = true
port = 8501
enableCORS = false
enableWebsocketCompression = true

[logger]
level = "info"

[runner]
magicEnabled = true

[deprecation]
showPyplotGlobalUse = false
